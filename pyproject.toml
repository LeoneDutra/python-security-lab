[project]
name = "python-security-lab"
version = "0.1.0"
description = "Python do básico ao intermediário, com foco em IA e Segurança (preparação para a Pós Tech FIAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
notebooks = [
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["fase0_ambiente", "diagnostico"]
addopts = "-q"

[tool.ruff]
line-length = 100
