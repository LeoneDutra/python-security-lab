[project]
name = "python-security-lab"
version = "0.1.0"
description = "Hands-on Python lab focused on security operations and AI for security"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
notebooks = [
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["phase0_setup", "diagnostic"]
addopts = "-q"

[tool.ruff]
line-length = 100
